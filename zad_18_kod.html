    <textarea readonly>Завдання 18: Алгоритми пошуку

Реалізуйте наступні алгоритми пошуку:

1. linearSearch(arr, target) - лінійний пошук
2. binarySearch(arr, target) - двійковий пошук
3. exponentialSearch(arr, target) - експоненційний пошук
4. jumpSearch(arr, target) - поточковий пошук
5. interpolationSearch(arr, target) - інтерполяційний пошук
6. fibonacciSearch(arr, target) - пошук Фібоначчі
7. ternarySearch(arr, target) - потрійний пошук
8. findAll(arr, target) - знайти всі входження
9. findClosest(arr, target) - знайти найближче значення
10. findRange(arr, target) - знайти діапазон значень

Приклад:
arr = [11, 12, 22, 25, 64]
linearSearch(arr, 25) = 3
binarySearch(arr, 25) = 3
findAll([1, 2, 2, 2, 3], 2) = [1, 2, 3]
findClosest([1, 3, 6, 10], 7) = 6

Вимоги:
- Лінійний пошук: O(n)
- Двійковий пошук: O(log n)
- Обробити не відсортовані масиви
- Функції повинні повертати індекс або -1

Вимоги:
- Перевірити продуктивність для великих масивів
- Обробити граничні випадки
- Порівняти складність алгоритмів
- Додати рахунок операцій

Бонус:
- Пошук регулярних виразів
- Пошук найдовшої підпослідовності
- Пошук з лівого та правого боку
