    <script language="JavaScript"> 
  var x=prompt("podaj liczbę x=",""); 
               var a_dana_pon=parseFloat(x); 
    document.write("czytana liczba x="+a_dana_pon+"<br>");     
               if(a_dana_pon%2==0)
                        document.write("<font size='3'>czytana liczba jest parzysta</font>"+"<br>");
                else if(a_dana_pon%2!=0)
                        document.write("<font color='silver' size='5'>czytana liczba jest nieparzysta</font>"+"<br>");
                  </script>
